[package]
name = "blacknode-ros2"
version = "0.5.16"
description = "ROS 2 graph, topic, service, process, native, and rosbridge integration primitives."
requires-blacknode = ">=0.3.0"
layer = "ros2"
component-mode = true

[categories]
"ROS 2" = "#2e9fe6"

[components.core]
description = "Shared native ROS 2 graph and DDS access that the integration components build on."
default = true
capabilities = ["integration.ros2", "transport.ros2"]
nodes = ["nodes"]
module-root = true

[components.core.dependencies]
pip = ["PyYAML>=6", "numpy>=1.24", "pillow>=10"]
imports = ["yaml", "numpy", "PIL"]

[components.rosbridge]
description = "rosbridge websocket transport and server lifecycle."
default = false
capabilities = ["transport.rosbridge"]
nodes = ["components/rosbridge/nodes"]
node-types = [
  "ROS2BridgeEcho", "ROS2BridgePublish", "ROS2RosbridgeServer", "ROS2RosbridgeStatus"
]

[components.rosbridge.dependencies]
pip = ["roslibpy>=1.5"]
imports = ["roslibpy"]
requires = [{ component = "core" }]

[components.topics]
description = "Topic discovery, named subscriptions, echo, and publication."
default = true
capabilities = ["integration.ros2.topics"]
nodes = ["components/topics/nodes"]
node-types = [
  "ROS2", "ROS2TopicEcho", "ROS2TopicList", "ROS2TopicPublisher", "ROS2TopicRelay",
  "ROS2TopicSubscriber"
]

[components.topics.dependencies]
requires = [{ component = "core" }]

[components.services]
description = "Service discovery."
default = true
capabilities = ["integration.ros2.services"]
nodes = ["components/services/nodes"]
node-types = [
  "ROS2ServiceList"
]

[components.services.dependencies]
requires = [{ component = "core" }]

[components.processes]
description = "ros2 run/launch process supervision."
default = false
capabilities = ["integration.ros2.processes"]
nodes = ["components/processes/nodes"]
node-types = [
  "ROS2Launch", "ROS2PackageExecutables", "ROS2PythonNode", "ROS2Run",
  "ROS2WorkspaceBuild"
]

[components.processes.dependencies]
requires = [{ component = "core" }]

[components.diagnostics]
description = "Graph health, node lists, and status dashboards."
default = true
capabilities = ["integration.ros2.diagnostics"]
nodes = ["components/diagnostics/nodes"]
node-types = [
  "ROS2GraphExplorer", "ROS2InterfaceShow", "ROS2NodeList", "ROS2Status",
  "ROS2SystemCheck", "ROS2VisualDashboard"
]

[components.diagnostics.dependencies]
requires = [{ component = "core" }]
